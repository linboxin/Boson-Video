[project]
name = "boson-video"
version = "0.1.0"
description = "Near-instant video summaries: see what happens when, before any AI runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28",
    "mcp>=2.3.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "typesafe-sdk>=0.7.2",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
boson-video = "boson_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boson_video"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits YouTube over the network (run with `-m live`)"]
addopts = "-m 'not live'"
