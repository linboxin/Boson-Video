[project]
name = "boson-video"
version = "0.2.1"
description = "Skim any video: a timed summary, a bilingual transcript, screen text and checked answers, as a web page or an MCP plugin."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Lin" }]
keywords = ["mcp", "mcp-server", "video", "youtube", "transcript", "summary", "ocr", "claude", "subtitles", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
]
dependencies = [
    "deno>=2.0",
    "httpx[http2]>=0.28",
    "imageio-ffmpeg>=0.6.0",
    "mcp>=2.3.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "rapidocr-onnxruntime>=1.4.4",
    "sherpa-onnx>=1.13.8",
    "sherpa-onnx-core>=1.13.8",
    "typesafe-sdk>=0.7.2",
    "yt-dlp[default]>=2026.8.19",
]

[project.urls]
Homepage = "https://github.com/linboxin/Boson-Video"
Repository = "https://github.com/linboxin/Boson-Video"
Issues = "https://github.com/linboxin/Boson-Video/issues"

[project.scripts]
boson-video = "boson_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boson_video"]

[dependency-groups]
dev = [
    "opencc-python-reimplemented>=0.1.7",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits YouTube over the network (run with `-m live`)"]
addopts = "-m 'not live'"
